name: Bump workspace package version

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Workspace package directory'
        required: true
        type: choice
        default: graphic-walker
        options:
          - graphic-walker
          - duckdb-wasm-computation
          - graphic-walker-embed
      newVersion:
        description: 'New semver version'
        required: true

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump version and sync workspace refs
        run: node scripts/bump-workspace-version.mjs ${{ inputs.package }} ${{ inputs.newVersion }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: chore(release): bump ${{ inputs.package }} to ${{ inputs.newVersion }}
          title: chore(release): bump ${{ inputs.package }} to ${{ inputs.newVersion }}
          body: |
            Automated bump of `${{ inputs.package }}` to `${{ inputs.newVersion }}` and sync of internal workspace dependency pins.
          branch: bump-${{ inputs.package }}-${{ inputs.newVersion }}
